AWSTemplateFormatVersion: "2010-09-09"
Description: Phase 1 - ECR repository that holds the resizer Lambda image.

Parameters:
  NamePrefix:
    Type: String
    Default: lambda-pic-scaler
    AllowedPattern: "^[a-z][a-z0-9-]{0,29}$"
    ConstraintDescription: Lowercase letters, digits and hyphens, starting with a letter, max 30 characters.
    Description: Common prefix of every named resource, followed by a suffix for its purpose.

Resources:
  ImageRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}-resizer-image"
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              StringLike:
                aws:sourceArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"

Outputs:
  RepositoryUri:
    Value: !GetAtt ImageRepo.RepositoryUri
