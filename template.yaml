AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Phase 3 - resizes images put in an S3 bucket, following the "resize" object metadata.

Parameters:
  NamePrefix:
    Type: String
    Default: lambda-pic-scaler
    AllowedPattern: "^[a-z][a-z0-9-]{0,29}$"
    ConstraintDescription: Lowercase letters, digits and hyphens, starting with a letter, max 30 characters.
    Description: Common prefix of every named resource, followed by a suffix for its purpose.
  ImageUri:
    Type: String
    Description: Full address (repository:tag) of the image pushed in phase 2.
  BucketName:
    Type: String
    Description: Name of an existing bucket with EventBridge notifications turned on.
  KeyPrefix:
    Type: String
    Default: ""
    Description: Optional key prefix; only objects under it trigger the function.
  AlarmEmail:
    Type: String
    Description: Email address subscribed to the alarm topic (AWS sends a confirmation mail).
  MaxConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Hard cap on parallel executions, which bounds spend rate whatever happens. Needs this much unreserved account concurrency left over (min 10).
  InvocationsAlarmThreshold:
    Type: Number
    Default: 1000
    Description: Alarm when the function is invoked this many times in 5 minutes (runaway/loop detector). Raise it for bulk imports.

Conditions:
  HasPrefix: !Not [!Equals [!Ref KeyPrefix, ""]]

Resources:
  FailedEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${NamePrefix}-failed-events"
      MessageRetentionPeriod: 1209600 # 14 days

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${NamePrefix}-alarms"

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ResizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-resizer-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:aws:s3:::${BucketName}/${KeyPrefix}*"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FailedEventsQueue.Arn

  ResizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NamePrefix}-resizer"
      RetentionInDays: 90

  Resizer:
    Type: AWS::Serverless::Function
    DependsOn: ResizerLogGroup
    Properties:
      FunctionName: !Sub "${NamePrefix}-resizer"
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      ReservedConcurrentExecutions: !Ref MaxConcurrency
      Timeout: 60
      MemorySize: 1024 # Lambda CPU scales with memory, and libvips uses several threads
      Role: !GetAtt ResizerRole.Arn
      DeadLetterQueue: # EventBridge invokes asynchronously: failed events must not vanish
        Type: SQS
        TargetArn: !GetAtt FailedEventsQueue.Arn

  ImageCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NamePrefix}-image-created"
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket: {name: [!Ref BucketName]}
          object: !If
            - HasPrefix
            - {key: [{prefix: !Ref KeyPrefix}]}
            - !Ref AWS::NoValue
      Targets:
        - {Id: resizer, Arn: !GetAtt Resizer.Arn}

  ImageCreatedPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Resizer
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ImageCreatedRule.Arn

  ResizerRetryConfig: # bounded async retries: a failing event cannot be replayed forever
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Resizer
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      MaximumEventAgeInSeconds: 3600

  InvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-invocations-alarm"
      AlarmDescription: Unusually many invocations, check for a processing loop
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{Name: FunctionName, Value: !Ref Resizer}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref InvocationsAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-errors-alarm"
      AlarmDescription: The resizer failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref Resizer}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-throttles-alarm"
      AlarmDescription: The resizer was throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref Resizer}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ResizerName:
    Value: !Ref Resizer
